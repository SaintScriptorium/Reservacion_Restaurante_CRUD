<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Reservations</title>
    
    <link rel="stylesheet" href="stylesui.css">
</head>
<body>

    <h2>Mangiare</h2>
    
  
    <form id="reservationForm">
        <input type="hidden" id="editId">
        <div class="form-group">
            <input type="text" id="name" placeholder="Nombre Cliente" required>
        </div>
        <div class="form-group">
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <input type="time" id="time" required>
        </div>
        <div class="form-group">
            <input type="number" id="guests" placeholder="Numero de personas" min="1" required>
        </div>
        <button type="submit">Guardar Reservacion</button>
    </form>


    <table id="reservationsTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Date</th>
                <th>Time</th>
                <th>Guests</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    
    <script src="app.js"></script>
</body>
</html>
